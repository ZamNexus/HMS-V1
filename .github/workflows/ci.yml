name: CI

on:
  push:
    branches: [hms-frontend]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `next build` / `next start` require BACKEND_URL (next.config.ts validates it and
# bakes the /api/* rewrite target into the build). CI never talks to a backend:
# unit tests are offline and the e2e tests stub the requests they make. A
# non-secret placeholder is enough; `.invalid` is reserved (RFC 2606) and can
# never resolve, so an accidental real call fails fast instead of hitting a server.
env:
  BACKEND_URL: https://hms-backend.invalid

jobs:
  checks:
    name: Lint, types, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.x (latest 20) covers the "engines" minimum, 20.19.0 (dev tooling needs it);
        # 24.x matches local development
        node: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # schema.d.ts must equal what is generated from docs/openapi.json (does not detect backend drift: see scripts/check-types-drift.mjs)
      - run: npm run types:check
      - run: npm test
      # Known vulnerabilities in what ships to users (dev tooling is not part of the product). Fails on high or critical.
      - run: npm audit --omit=dev --audit-level=high
      # Also type-checks; downloads next/font Google fonts at build time
      - run: npm run build

  e2e:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the app and serves it with `next start`
      - run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  browser:
    name: API-mode browser suites (test backends, production build)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the production build serves the API (no demo data path is chosen by an environment variable)
      - run: npm run build
      # Real browser, stateful test backends that validate every request and response against docs/openapi.json (e2e-api/README.md). No real server is contacted.
      - run: npm run test:browser
      # Go-live gate: the API production build must not carry the demo data (the "@hms/demo" seam is replaced by a stub, see next.config.ts). Fails the job if any marker is found.
      - run: npm run check:build
      - name: Upload the suite output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-output
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
